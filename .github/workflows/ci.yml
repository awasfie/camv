name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        # No real LIVEKIT_*/CAMV_INTERNAL_SECRET/etc. needed here -- every
        # route handler in this app reads process.env at REQUEST time, not
        # at build time (confirmed locally: `next build` with those vars
        # unset/empty succeeds and produces all 4 dynamic API routes).
        run: pnpm run build

      - name: Test
        run: pnpm test
